[package]
name = "clt-rs"
version = "0.2.2"
edition = "2024"
description = "File-backed task manager with a TUI Kanban board and multi-project Codex agent registry"
license = "MIT"
repository = "https://github.com/AlpineVibrations/clt-rs"
readme = "README.md"
keywords = ["cli", "tasks", "kanban", "tui", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "clt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1.0"
chrono = "0.4"
tui-input = "0.15.3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time"] }
turso = { version = "=0.7.0-pre.17", default-features = false }
